# Secret scanning
#
# Purpose: stop credentials (API keys, tokens, passwords, private keys) from
# ever living in the Git history. Odysseus deliberately keeps real secrets in
# files that are gitignored (.env, data/), but a slip in a future commit -- or a
# malicious pull request that sneaks one in -- would otherwise go unnoticed.
#
# On pull requests, scan only commits introduced by the PR. This still catches
# a secret added in an earlier PR commit and deleted in a later PR commit while
# avoiding findings from unrelated divergent repository history.
#
# It runs the official gitleaks BINARY directly (pinned to an exact version and
# verified against the project's published SHA-256 checksum) rather than the
# gitleaks GitHub Action, because the Action asks for a paid license on
# organization-owned repos. The binary is free and behaves identically.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Start with zero permissions; the single job opts back in to read-only.
permissions: {}

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Keep full history available so merge-base/range resolution is
          # deterministic. Gitleaks itself is scoped below with --log-opts.
          fetch-depth: 0
          persist-credentials: false

      # Pinned version + checksum so a tampered release binary cannot run here.
      # Bump VERSION/SHA256 together; the checksum comes from the matching
      # gitleaks_<version>_checksums.txt on the GitHub release.
      - name: Run gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "${TARBALL}" gitleaks

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              test -n "${PR_BASE_SHA}"
              test -n "${PR_HEAD_SHA}"
              MERGE_BASE="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
              test -n "${MERGE_BASE}"
              LOG_OPTS="${MERGE_BASE}..${PR_HEAD_SHA}"
              ;;
            push)
              test -n "${PUSH_AFTER_SHA}"
              if [[ -n "${PUSH_BEFORE_SHA}" && ! "${PUSH_BEFORE_SHA}" =~ ^0+$ ]]; then
                LOG_OPTS="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
              else
                # Branch bootstrap / all-zero "before": scan history reachable
                # from the new tip rather than silently accepting an empty range.
                LOG_OPTS="${PUSH_AFTER_SHA}"
              fi
              ;;
            workflow_dispatch)
              test -n "${GITHUB_SHA}"
              LOG_OPTS="${GITHUB_SHA}"
              ;;
            *)
              echo "Unsupported event: ${GITHUB_EVENT_NAME}" >&2
              exit 2
              ;;
          esac

          COMMIT_COUNT="$(git rev-list --count "${LOG_OPTS}")"
          if [[ "${COMMIT_COUNT}" -lt 1 ]]; then
            echo "Refusing empty gitleaks commit range: ${LOG_OPTS}" >&2
            exit 2
          fi

          echo "gitleaks_scope=${LOG_OPTS}"
          echo "gitleaks_commit_count=${COMMIT_COUNT}"

          ./gitleaks git \
            --no-banner \
            --redact \
            --verbose \
            --log-opts="${LOG_OPTS}" \
            .
